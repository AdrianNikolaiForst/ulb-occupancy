<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Zero Sensor Daten</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; padding: 50px; }
        .container { max-width: 600px; margin: auto; background: #1e1e1e; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #3ecf8e; } /* Supabase-Grün */
        #daten-liste { list-style: none; padding: 0; text-align: left; }
        #daten-liste li { padding: 10px; border-bottom: 1px solid #333; }
        .zeit { color: #888; font-size: 0.8rem; float: right; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Raspberry Pi Daten</h1>
        <p>Neueste Nachrichten von deinem Pi Zero 2W:</p>
        <ul id="daten-liste">Lade Daten...</ul>
    </div>

    <script>
        // 1. SUPABASE KONFIGURATION
        // Tausche diese Platzhalter mit deinen echten Supabase-Daten aus!
        const SUPABASE_URL = "https://oxccbidtyqtzkinbbgcd.supabase.co/rest/v1/nachrichten";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im94Y2NiaWR0eXF0emtpbmJiZ2NkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzcyMzEwNTUsImV4cCI6MjA5MjgwNzA1NX0.d1zwa5cMxW_Z4vNR4r9cvfQgsQ4B3ujRplHB95ATmGw";

        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. DATEN AUSLESEN
        async function holeDaten() {
            // "nachrichten" ist der Name deiner Tabelle in Supabase
            let { data, error } = await supabase
                .from('nachrichten') 
                .select('*')
                .order('created_at', { ascending: false }) // Neueste zuerst
                .limit(10); // Nur die letzten 10 anzeigen

            if (error) {
                console.error("Fehler beim Laden:", error);
                document.getElementById('daten-liste').innerHTML = "Fehler beim Laden der Daten.";
                return;
            }

            // HTML Liste aufbauen
            const liste = document.getElementById('daten-liste');
            liste.innerHTML = ""; // "Lade..." Text entfernen

            if (data.length === 0) {
                liste.innerHTML = "<li>Noch keine Nachrichten vorhanden.</li>";
            }

            data.forEach(eintrag => {
                const li = document.createElement('li');
                // Erstelle das Datum lesbar (Spaltennamen "text" und "created_at" anpassen!)
                const zeit = new Date(eintrag.created_at).toLocaleString('de-DE');
                li.innerHTML = `${eintrag.text} <span class="zeit">${zeit}</span>`;
                liste.appendChild(li);
            });
        }

        // Starte die Funktion beim Laden der Seite
        holeDaten();
    </script>
</body>
</html>
